[package]
name = "craft"
version = "0.1.0"
edition = "2024"

[features]
lower = []
trace = []
default = ["lower"]

[profile.release]
codegen-units = 1
strip = "symbols"
lto = "fat"
panic = "abort"

[dependencies]
bitflags = "2.13.2"
bitvec = "1.1.1"
ena = "0.14.4"
indexmap = "2.14.2"
rustc-hash = "2.1.3"
stacker = "0.1.25"
